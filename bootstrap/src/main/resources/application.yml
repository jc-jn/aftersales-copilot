spring:
  application:
    name: aftersales-server
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:aftersales}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${MYSQL_USER:aftersales}
    password: ${MYSQL_PASSWORD:aftersales_dev_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration/structure
    default-schema: ${MYSQL_DATABASE:aftersales}
  jackson:
    time-zone: UTC
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:aftersales}
    password: ${RABBITMQ_PASSWORD:rabbitmq_dev_password}
server:
  port: ${SERVER_PORT:8080}
app:
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minio_dev_password}
    bucket: ${MINIO_BUCKET:aftersales-private}
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: aftersales-server
    jwt-access-ttl: PT15M
    jwt-refresh-ttl: P7D
  ai:
    internal-secret: ${AI_INTERNAL_SECRET:change-me-local-only}
    outbox-interval-ms: ${AI_OUTBOX_INTERVAL_MS:1000}
    llm-base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    llm-api-key: ${LLM_API_KEY:}
    llm-model: ${LLM_CHAT_MODEL:gpt-4o-mini}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
